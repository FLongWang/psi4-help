ps4.driver:
  atomiccomputer:
    description: Computer for analytic single-geometry computations.
    element: null
  convergenceerror:
    description: Error called for problems with converging an iterative method.
    element: null
  empiricaldispersion:
    description: Lightweight unification of empirical dispersion calculation modes.
    element:
      compute_energy:
      - compute_energy(molecule[,wfn])
      - Compute dispersion energy based on engine, dispersion level, and parameters
        in <cite>self</cite>.
      compute_gradient:
      - compute_gradient(molecule[,wfn])
      - Compute dispersion gradient based on engine, dispersion level, and parameters
        in <cite>self</cite>.
      compute_hessian:
      - compute_hessian(molecule[,wfn])
      - Compute dispersion Hessian based on engine, dispersion level, and parameters
        in <cite>self</cite>.
      print_out:
      - print_out()
      - Format dispersion parameters of <cite>self</cite> for output file.
  managedmethoderror:
    description: Error called when a requested level of theory and derivative level
      are nominally available but not for the particular conditions (e.g., reference,
      algorithm, active orbitals, QC module, etc.) requested.
    element: null
  missingmethoderror:
    description: Error called when requested level or theory or derivative level are
      not available.
    element: null
  optimizationconvergenceerror:
    description: Error called for problems with geometry optimizer.
    element: null
  parsingerror:
    description: Error called for problems parsing a text file.
    element: null
  pasturerequirederror:
    description: Error called when the specified value of option requires some module(s)
      from Psi4Pasture, but could not be imported.
    element: null
  psiexception:
    description: Error class for PSI4.
    element: null
  qmmm:
    description: Hold charges and psi4.core.ExternalPotential.
    element: null
  qmmmbohr:
    description: Hold charges and psi4.core.ExternalPotential.
    element:
      addchargeangstrom:
      - addChargeAngstrom(Q,x,y,z)
      - Function to add a point charge of magnitude <em>Q</em> at position (<em>x</em>,
        <em>y</em>, <em>z</em>) Angstroms.
      addchargebohr:
      - addChargeBohr(Q,x,y,z)
      - Function to add a point charge of magnitude <em>Q</em> at position (<em>x</em>,
        <em>y</em>, <em>z</em>) Bohr.
      adddiffuse:
      - addDiffuse(diffuse)
      - Function to add a diffuse charge field <em>diffuse</em>.
      populateextern:
      - populateExtern()
      - Function to define a charge field external to the molecule through point and
        diffuse charges.
  scfconvergenceerror:
    description: Error called for problems with SCF iterations.
    element: null
  tdscfconvergenceerror:
    description: Error called for problems with TDSCF iterations.
    element: null
  testcomparisonerror:
    description: Error called when a compare_values() or other comparison function
      fails.
    element: null
  upgradehelper:
    description: Error called on previously valid syntax that now isn't and a simple
      syntax transition is possible.
    element: null
  validationerror:
    description: Input specification has problems.
    element: null
